name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Weekly multi-region sweep. PRs and pushes run a single region (see the
  # matrix expressions below): three regions in parallel against one public
  # demo tripped Cloudflare's rate limiter (HTTP 429, error 1015) and turned
  # every run red without testing anything extra.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Which layer to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - web
      region:
        description: 'Which region to run (ignored when triggered by push/PR)'
        required: false
        default: 'us'
        type: choice
        options:
          - us
          - eu
          - apac

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  lint:
    # Name kept stable on purpose: branch protection may require this exact
    # check, and renaming it would leave PRs waiting on a check that no longer
    # exists. It runs the same gate as `npm run verify` locally.
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # `npm run check:assertions` diffs against origin/main; a depth-1
          # clone has no merge base, which would silently disable the gate.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:assertions

  # ParaBank is a third-party demo the repo cannot fix. On 2026-11-20 it returned
  # 500 on /services/bank/**, and Cloudflare rate-limited repeated calls with 429.
  # Without this probe every red run looked like a repository defect. The gate is
  # deliberately narrow: it only skips the suites when the vendor is *unhealthy*,
  # never when a test fails, so a genuine regression still shows up as a failure.
  upstream:
    name: Upstream health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      healthy: ${{ steps.probe.outputs.healthy }}
      ui: ${{ steps.probe.outputs.ui }}
      api: ${{ steps.probe.outputs.api }}
      login: ${{ steps.probe.outputs.login }}
    steps:
      - id: probe
        name: Probe ParaBank UI, API and seeded login
        run: |
          set -eu
          ui=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://parabank.parasoft.com/parabank/index.htm || echo 000)
          api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://parabank.parasoft.com/parabank/services/bank/customers/12212/accounts || echo 000)
          # Every suite starts with this login. On 2026-11-21 the two endpoints
          # above still answered 200 while ParaBank rejected the seeded
          # john/demo credentials with HTTP 400, so a 200-only probe declared the
          # vendor healthy and turned the API suite red for a vendor-side data
          # reset. Probe the precondition the tests actually need.
          login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://parabank.parasoft.com/parabank/services/bank/login/john/demo || echo 000)
          echo "UI=$ui API=$api LOGIN=$login"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "login=$login" >> "$GITHUB_OUTPUT"
          echo "| endpoint | status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| /parabank/index.htm | $ui |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /services/bank/customers/12212/accounts | $api |" >> "$GITHUB_STEP_SUMMARY"
          echo "| /services/bank/login/john/demo (seeded login) | $login |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ui" != "200" ] || [ "$api" != "200" ] || [ "$login" != "200" ]; then
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=ParaBank upstream unhealthy::UI=$ui API=$api LOGIN=$login. The demo suites are skipped because the vendor is down or its seeded data is gone (5xx/429/timeout/400 on login); this is not a repository defect."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Suites skipped: ParaBank is unhealthy (UI=$ui, API=$api, LOGIN=$login).** This is a vendor outage, not a test failure." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "healthy=true" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Upstream healthy — full suites will run.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The API layer is the gating demo suite: it is one HTTP client with no
  # browser and no Cloudflare challenge, and it passed in the very run where the
  # Web suite failed (44798937153). A red API job is a real signal, so it fails
  # the run instead of being tolerated.
  api:
    name: API tests (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: [lint, upstream]
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.record.outputs.outcome }}
    if: ${{ needs.upstream.outputs.healthy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'api') }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ (github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region))) || (github.event_name == 'schedule' && fromJSON('["us","eu","apac"]')) || fromJSON('["us"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests (excluding known-defect pins)
        id: suite
        run: npx playwright test --project=parabank-api --grep-invert @known-defect
        env:
          REGION: ${{ matrix.region }}
      - name: Record suite outcome
        # Read by the `verdict` job. Safe to run after a failure: job outputs
        # stay available either way, and this step never fails the job.
        id: record
        if: always()
        run: echo "outcome=${{ steps.suite.outcome || 'not-run' }}" >> "$GITHUB_OUTPUT"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api-${{ matrix.region }}
          path: playwright-report/
          retention-days: 14

  # Browser suite: non-blocking on purpose (see the `verdict` job). It stays
  # `continue-on-error` because a Cloudflare 429 in Web must not hide the API
  # signal, but its real state is recorded and reported - it is never silently
  # green.
  web:
    name: Web tests (${{ matrix.region }}) [non-blocking]
    runs-on: ubuntu-latest
    needs: [lint, upstream]
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      outcome: ${{ steps.record.outputs.outcome }}
    if: ${{ needs.upstream.outputs.healthy == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'web') }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ (github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region))) || (github.event_name == 'schedule' && fromJSON('["us","eu","apac"]')) || fromJSON('["us"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Bounded on purpose: a stalled browser mirror hung this step for the full
        # 30-minute job budget on 2026-11-18 (eu runner), and the job timeout
        # cancelled the entire run with the tests never executed. Failing here
        # instead turns a lost half-hour into a fast, re-runnable failure.
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Save Playwright browsers
        # actions/cache's own post-step only saves on a SUCCESSFUL job, and this
        # suite is red whenever the public demo is unwell - so the cache would
        # never fill. Save explicitly, even when the tests fail.
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        # On a cache hit the browsers are present; this is bare apt-get, which is
        # the part that stalls on a degraded mirror. Bounded and non-fatal: if a
        # library really is missing, the test step names the packages itself.
        timeout-minutes: 10
        continue-on-error: true
        run: npx playwright install-deps chromium firefox webkit

      - name: Run Web tests
        id: suite
        # A shared public demo rate-limits bursts: Cloudflare answered 1015/429
        # when two workers across three engines ran fully parallel (2026-11-20),
        # and the login page itself stopped rendering. Serialise in CI - same
        # coverage, one request stream - rather than shrinking the matrix.
        run: npm run test:web -- --grep-invert @known-defect --workers=1
        env:
          REGION: ${{ matrix.region }}
      - name: Record suite outcome
        # `continue-on-error` above makes needs.<job>.result say "success" even
        # when this suite is red (run 44798937153). This output is the truth the
        # `verdict` job reads.
        id: record
        if: always()
        run: echo "outcome=${{ steps.suite.outcome || 'not-run' }}" >> "$GITHUB_OUTPUT"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-web-${{ matrix.region }}
          path: playwright-report/
          retention-days: 14

  # Pins that assert *current buggy* ParaBank behaviour. They are run separately
  # from the main suite so a vendor fix surfaces as a red pin rather than noise
  # inside the green happy-path signal.
  known-defects:
    name: Known-defect pins [informational, non-blocking]
    runs-on: ubuntu-latest
    needs: [lint, upstream]
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      outcome: ${{ steps.record.outputs.outcome }}
    if: ${{ needs.upstream.outputs.healthy == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'api') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API known-defect pins
        id: api-pins
        run: npx playwright test --project=parabank-api --grep @known-defect --workers=1
        env:
          REGION: us
      - name: Install Chromium for the web pins
        run: npx playwright install --with-deps chromium
      - name: Run Web known-defect pins
        id: web-pins
        run: npx playwright test --project=parabank-web-chromium --grep @known-defect --workers=1
        env:
          REGION: us
      - name: Record suite outcome
        # Two legs (API + Web pins) collapse into one outcome. Either leg red =
        # red; a leg that never ran is a setup failure, not a pass.
        id: record
        if: always()
        run: |
          api='${{ steps.api-pins.outcome }}'
          web='${{ steps.web-pins.outcome }}'
          echo "api-pins=$api web-pins=$web"
          if [ "$api" = "failure" ] || [ "$web" = "failure" ]; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          elif [ "$api" = "success" ] && [ "$web" = "success" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          elif [ "$api" = "success" ] || [ "$web" = "success" ]; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=not-run" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-known-defects
          path: playwright-report/
          retention-days: 14

  # Order-independence check: Playwright 1.64's --shuffle randomises the run
  # order, which surfaces tests that quietly depend on another test running
  # first. Non-blocking (see `verdict`): the demo is external, so a red shuffle
  # is reported, not silently swallowed.
  shuffle:
    name: Shuffled smoke run [informational, non-blocking]
    runs-on: ubuntu-latest
    needs: [lint, upstream]
    timeout-minutes: 20
    continue-on-error: true
    outputs:
      outcome: ${{ steps.record.outputs.outcome }}
    if: ${{ needs.upstream.outputs.healthy == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'web') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests in random order
        id: suite
        run: npm run test:shuffle -- --project=parabank-web-chromium --grep @smoke --workers=1
        env:
          REGION: us
      - name: Record suite outcome
        id: record
        if: always()
        run: echo "outcome=${{ steps.suite.outcome || 'not-run' }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The only job allowed to say what the run means.
  #
  # Before this job existed, `continue-on-error` on the demo suites made
  # `needs.<job>.result` report `success` while they were red: run 44798937153
  # failed "Run Web tests" and "Run Web known-defect pins" and still concluded
  # `success`, so `gh run list` reported a green repo that was not green.
  #
  # The verdict reads the suites' *step* outcomes (which stay truthful) and:
  #   - fails the run when a suite failed, or a selected suite never ran while
  #     ParaBank was healthy (a silent skip is never a pass);
  #   - does NOT fail when the upstream probe says the vendor is unhealthy -
  #     there is nothing to judge - but says NOT VERIFIED instead of success.
  # ---------------------------------------------------------------------------
  verdict:
    name: Run verdict
    runs-on: ubuntu-latest
    needs: [lint, upstream, api, web, known-defects, shuffle]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Write a machine-readable run verdict
        id: verdict
        env:
          EVENT: ${{ github.event_name }}
          LAYER: ${{ inputs.layer }}
          HEALTHY: ${{ needs.upstream.outputs.healthy }}
          UI_CODE: ${{ needs.upstream.outputs.ui }}
          API_CODE: ${{ needs.upstream.outputs.api }}
          LOGIN_CODE: ${{ needs.upstream.outputs.login }}
          UPSTREAM_RESULT: ${{ needs.upstream.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SUITE_API_RESULT: ${{ needs.api.result }}
          SUITE_API_OUTCOME: ${{ needs.api.outputs.outcome }}
          SUITE_WEB_RESULT: ${{ needs.web.result }}
          SUITE_WEB_OUTCOME: ${{ needs.web.outputs.outcome }}
          SUITE_KNOWN_DEFECTS_RESULT: ${{ needs.known-defects.result }}
          SUITE_KNOWN_DEFECTS_OUTCOME: ${{ needs.known-defects.outputs.outcome }}
          SUITE_SHUFFLE_RESULT: ${{ needs.shuffle.result }}
          SUITE_SHUFFLE_OUTCOME: ${{ needs.shuffle.outputs.outcome }}
          VERDICT_FILE: run-verdict.json
        run: bash .github/scripts/run-verdict.sh
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-verdict
          path: run-verdict.json
          retention-days: 30

  # Publishes every report artifact (API/Web per region) to GitHub Pages.
  # Requires GitHub Pages to be enabled once: Settings > Pages > Source = GitHub
  # Actions. Only runs on main so pull requests never overwrite the published
  # site (and never leave a red deploy check on a dependency bump).
  publish-report:
    name: Publish HTML report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 10
    # GitHub Pages permits one deployment at a time. Two merges landing close
    # together used to fail with "Deployment request failed ... due to in
    # progress deployment". Queue the second run instead of letting it collide.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    # No reports exist when the upstream probe skipped the suites, and publishing
    # an empty site over a good one is worse than publishing nothing.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.web.result != 'skipped' }}
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          path: site
      - name: Generate index page
        run: |
          cd site
          printf '<h1>Playwright reports</h1><ul>\n' > index.html
          for d in */; do printf '<li><a href="%s">%s</a></li>\n' "$d" "${d%/}" >> index.html; done
          printf '</ul>\n' >> index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
