name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Which layer to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - web
      region:
        description: 'Which region to run (ignored when triggered by push/PR)'
        required: false
        default: 'us'
        type: choice
        options:
          - us
          - eu
          - apac

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  api:
    name: API tests (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    # ParaBank is a shared public demo we do not control; its flakiness must
    # not block PRs or main. Reports are still uploaded for investigation.
    continue-on-error: true
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'api' }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["us","eu","apac"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm run test:api
        env:
          REGION: ${{ matrix.region }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api-${{ matrix.region }}
          path: playwright-report/
          retention-days: 14

  web:
    name: Web tests (${{ matrix.region }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    continue-on-error: true
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'web' }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.region)) || fromJSON('["us","eu","apac"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Web tests
        run: npm run test:web
        env:
          REGION: ${{ matrix.region }}
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-${{ matrix.region }}
          path: playwright-report/
          retention-days: 14
